name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: '2026.8.11'
          sha256: 3d825b8341925abb398fba6fd8dcd7d6e92ade6820d892da62992e0765638e66
          install_args: >-
            --locked java bun node hk pkl lychee gh zizmor betterleaks
            github:github/gh-actions-lock github:jdx/jactionlint
          cache: true
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: mise run deps
      - run: hk check --all --profile ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

  library-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: '2026.8.11'
          sha256: 3d825b8341925abb398fba6fd8dcd7d6e92ade6820d892da62992e0765638e66
          install_args: --locked java bun
          cache: true
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: mise run test:kotlin

  compile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: '2026.8.11'
          sha256: 3d825b8341925abb398fba6fd8dcd7d6e92ade6820d892da62992e0765638e66
          install_args: --locked java bun
          cache: true
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - run: mise run test:compile
        env:
          COMPILE_TEST_SHARD_COUNT: 4
          COMPILE_TEST_SHARD_INDEX: ${{ matrix.shard }}

  connection-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            sqlite-inmemory,
            sqlite-file,
            d1,
            postgres-direct,
            postgres-hyperdrive,
            pglite,
            mysql-direct,
            mysql-hyperdrive,
            mariadb-direct,
            mariadb-hyperdrive,
            sqlserver-direct,
            oracle-direct,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: '2026.8.11'
          sha256: 3d825b8341925abb398fba6fd8dcd7d6e92ade6820d892da62992e0765638e66
          install_args: --locked java bun node
          cache: true
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: mise run test:connection-target ${{ matrix.target }}

  test:
    if: ${{ always() }}
    needs: [quality, library-tests, compile-tests, connection-targets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful verification jobs
        run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.library-tests.result }}" = success
          test "${{ needs.compile-tests.result }}" = success
          test "${{ needs.connection-targets.result }}" = success
