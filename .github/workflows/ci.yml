name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      library: ${{ steps.plan.outputs.library }}
      compile: ${{ steps.plan.outputs.compile }}
      connection_targets: ${{ steps.plan.outputs.connection_targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            node scripts/ci-changes.mjs --all >> "$GITHUB_OUTPUT"
          else
            node scripts/ci-changes.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.8.11'
          sha256: 3d825b8341925abb398fba6fd8dcd7d6e92ade6820d892da62992e0765638e66
          install_args: >-
            --locked java bun node hk rumdl pkl lychee gh zizmor betterleaks
            github:github/gh-actions-lock github:jdx/jactionlint
          cache: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: mise run deps
      - run: mise run test:ci-changes
      - run: hk check --all --profile ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

  library-tests:
    needs: changes
    if: ${{ needs.changes.outputs.library == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.8.11'
          sha256: 3d825b8341925abb398fba6fd8dcd7d6e92ade6820d892da62992e0765638e66
          install_args: --locked java bun
          cache: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: mise run test:kotlin

  compile-tests:
    needs: changes
    if: ${{ needs.changes.outputs.compile == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.8.11'
          sha256: 3d825b8341925abb398fba6fd8dcd7d6e92ade6820d892da62992e0765638e66
          install_args: --locked java bun
          cache: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - run: mise run test:compile
        env:
          COMPILE_TEST_SHARD_COUNT: 4
          COMPILE_TEST_SHARD_INDEX: ${{ matrix.shard }}

  connection-targets:
    needs: changes
    if: ${{ needs.changes.outputs.connection_targets != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.connection_targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.8.11'
          sha256: 3d825b8341925abb398fba6fd8dcd7d6e92ade6820d892da62992e0765638e66
          install_args: --locked java bun node
          cache: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: mise run test:connection-target "$CONNECTION_TARGET"
        env:
          CONNECTION_TARGET: ${{ matrix.target }}

  test:
    if: ${{ always() }}
    needs: [changes, quality, library-tests, compile-tests, connection-targets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful verification jobs
        run: |
          test "${{ needs.changes.result }}" = success
          test "${{ needs.quality.result }}" = success
          test "${{ needs.library-tests.result }}" = success || test "${{ needs.library-tests.result }}" = skipped
          test "${{ needs.compile-tests.result }}" = success || test "${{ needs.compile-tests.result }}" = skipped
          test "${{ needs.connection-targets.result }}" = success || test "${{ needs.connection-targets.result }}" = skipped
